events {
    worker_connections 1024;
}

http {
    # Upstream definitions
    upstream api {
        server api:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance tuning
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;  # Allow PDF uploads up to 50MB

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name _;

        # ------------------------------------------------------------------
        # /api/* → FastAPI backend (port 8000)
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;

            # Headers the backend needs to see the real client
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket / SSE support (streaming responses)
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            # Timeouts — LLM calls can take 30 s+
            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
            proxy_connect_timeout 10s;

            # Disable buffering for streaming responses (SSE / chunked)
            proxy_buffering off;
            proxy_cache off;
        }

        # ------------------------------------------------------------------
        # /docs and /redoc → FastAPI Swagger UI (convenience passthrough)
        # ------------------------------------------------------------------
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass        http://api;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # / → Next.js frontend (port 3000)
        # ------------------------------------------------------------------
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Required for Next.js HMR (hot-module reload) in dev
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_read_timeout 60s;
        }

        # Health check endpoint nginx itself can respond to
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}